[versions]
agp = "9.5.1"
kotlin = "2.4.21"
junit = "4.13.2"
ktfmt = "0.64"
spotless = "8.11.0"
detekt = "2.0.0-alpha.6"
composeRules = "0.6.8"
androidxTest = "1.7.0"

[libraries]
androidx-annotation = "androidx.annotation:annotation:1.11.0"
androidx-appcompat = "androidx.appcompat:appcompat:1.8.0"
androidx-cardview = "androidx.cardview:cardview:1.0.0"
androidx-collection = "androidx.collection:collection:1.7.0"
androidx-coordinatorlayout = "androidx.coordinatorlayout:coordinatorlayout:1.3.0"
androidx-core = "androidx.core:core:1.18.0"
androidx-drawerlayout = "androidx.drawerlayout:drawerlayout:1.2.0"
androidx-fragment = "androidx.fragment:fragment:1.9.1"
androidx-localbroadcastmanager = "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
androidx-palette = "androidx.palette:palette:1.0.0"
androidx-recyclerview = "androidx.recyclerview:recyclerview:1.4.0"
androidx-swiperefreshlayout = "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
androidx-transition = "androidx.transition:transition:1.6.0"
jsr305 = "com.google.code.findbugs:jsr305:3.0.2"
guava = "com.google.guava:guava:33.7.2-android"
libphonenumber = "com.googlecode.libphonenumber:libphonenumber:9.0.42"
libphonenumber-geocoder = "com.googlecode.libphonenumber:geocoder:3.42"
material = "com.google.android.material:material:1.14.0"

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = "androidx.test.ext:junit:1.3.0"
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-uiautomator = "androidx.test.uiautomator:uiautomator:2.3.0"
hamcrest-library = "org.hamcrest:hamcrest-library:1.3"
mockito-android = "org.mockito:mockito-android:5.20.0"

android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
spotless-gradlePlugin = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version.ref = "spotless" }
detekt-gradlePlugin = { group = "dev.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
compose-rules-detekt = { group = "io.nlopez.compose.rules", name = "detekt", version.ref = "composeRules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
pvot-android-application = { id = "pvot.android.application" }
pvot-quality-spotless = { id = "pvot.quality.spotless" }
pvot-quality-detekt = { id = "pvot.quality.detekt" }
